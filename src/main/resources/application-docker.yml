server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://payment-db:3306/bookstore_payment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${SPRING_DATASOURCE_USERNAME:bookstore}
    password: ${SPRING_DATASOURCE_PASSWORD:bookstore}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

payment:
  vnPay:
    url: ${VNPAY_URL}
    returnUrl: ${VNPAY_RETURN_URL}
    tmnCode: ${VNPAY_TMN_CODE}
    secretKey: ${VNPAY_SECRET_KEY}
    version: ${VNPAY_VERSION}
    command: ${VNPAY_COMMAND}
    orderType: ${VNPAY_ORDER_TYPE}
  zaloPay:
    appId: ${ZALOPAY_APP_ID}
    key1: ${ZALOPAY_KEY1}
    key2: ${ZALOPAY_KEY2}
    zaloPayUrl: ${ZALOPAY_URL}
    returnUrl: ${ZALOPAY_RETURN_URL}
    redirectUrl: ${ZALOPAY_REDIRECT_URL}
    callbackUrl: ${ZALOPAY_CALLBACK_URL}
  moMo:
    partnerCode: ${MOMO_PARTNER_CODE}
    accessKey: ${MOMO_ACCESS_KEY}
    secretKey: ${MOMO_SECRET_KEY}
    endpoint: ${MOMO_ENDPOINT}
    returnUrl: ${MOMO_RETURN_URL}
    ipnUrl: ${MOMO_IPN_URL}

frontend:
  url: ${FRONTEND_URL}
