spring:
  application:
    name: bookstore-payment-service

  profiles:
    active: dev

# --- Kafka / RabbitMQ Config ---
# Dù bạn chọn Kafka, trong file docker-compose đang có RabbitMQ. Tạm thời config Kafka.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8085

# --- Payment Gateway Configurations ---
payment:
  vnPay:
    url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    returnUrl: ${VNPAY_RETURN_URL:http://localhost:3000/payment/vnpay/return}
    tmnCode: ${VNPAY_TMN_CODE:YOUR_VNPAY_TMN_CODE}
    secretKey: ${VNPAY_SECRET_KEY:YOUR_VNPAY_SECRET_KEY}
    version: "2.1.0"
    command: "pay"
    orderType: "other"

  zaloPay:
    appId: ${ZALOPAY_APP_ID:YOUR_ZALOPAY_APP_ID}
    key1: ${ZALOPAY_KEY1:YOUR_ZALOPAY_KEY1}
    key2: ${ZALOPAY_KEY2:YOUR_ZALOPAY_KEY2}
    endpoint: ${ZALOPAY_ENDPOINT:https://sb-openapi.zalopay.vn/v2/create}
    returnUrl: ${ZALOPAY_RETURN_URL:http://localhost:3000/payment/zalopay/return}
    callbackUrl: ${ZALOPAY_CALLBACK_URL:http://your-ngrok-url/api/payment/zalopay/callback}
    
  moMo:
    partnerCode: ${MOMO_PARTNER_CODE:YOUR_MOMO_PARTNER_CODE}
    accessKey: ${MOMO_ACCESS_KEY:YOUR_MOMO_ACCESS_KEY}
    secretKey: ${MOMO_SECRET_KEY:YOUR_MOMO_SECRET_KEY}
    endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
    returnUrl: ${MOMO_RETURN_URL:http://localhost:3000/payment/momo/return}
    ipnUrl: ${MOMO_IPN_URL:http://your-ngrok-url/api/payment/momo/callback}

frontend:
  url: ${FRONTEND_URL:http://localhost:3000}
