server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bookstore_payment}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:bookstore}
    password: ${DB_PASSWORD:bookstore}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
  hikari:
    maximum-pool-size: ${DB_MAX_POOL_SIZE:3}
    minimum-idle: ${DB_MIN_IDLE:1}
    connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
    idle-timeout: ${DB_IDLE_TIMEOUT:300000}
    max-lifetime: ${DB_MAX_LIFETIME:600000}
    keepalive-time: ${DB_KEEPALIVE_TIME:120000}

# --- Payment Gateway Configurations for Production ---
payment:
  vnPay:
    url: ${VNPAY_URL}
    returnUrl: ${VNPAY_RETURN_URL}
    tmnCode: ${VNPAY_TMN_CODE}
    secretKey: ${VNPAY_SECRET_KEY}
    version: ${VNPAY_VERSION}
    command: ${VNPAY_COMMAND}
    orderType: ${VNPAY_ORDER_TYPE}

  zaloPay:
    appId: ${ZALOPAY_APP_ID}
    key1: ${ZALOPAY_KEY1}
    key2: ${ZALOPAY_KEY2}
    zaloPayUrl: ${ZALOPAY_URL}
    returnUrl: ${ZALOPAY_RETURN_URL}
    redirectUrl: ${ZALOPAY_REDIRECT_URL}
    callbackUrl: ${ZALOPAY_CALLBACK_URL}
    
  moMo:
    partnerCode: ${MOMO_PARTNER_CODE}
    accessKey: ${MOMO_ACCESS_KEY}
    secretKey: ${MOMO_SECRET_KEY}
    endpoint: ${MOMO_ENDPOINT}
    returnUrl: ${MOMO_RETURN_URL}
    ipnUrl: ${MOMO_IPN_URL}

frontend:
  url: ${FRONTEND_URL}
