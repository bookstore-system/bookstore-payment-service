server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://localhost:3310/bookstore_payment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: bookstore
    password: bookstore
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
