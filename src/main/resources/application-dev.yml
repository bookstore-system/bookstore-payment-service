server:
  port: 8085

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:bookstore}
    password: ${SPRING_DATASOURCE_PASSWORD:bookstore}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# --- Payment Gateway Configurations ---
payment:
  vnPay:
    url: ${VNPAY_URL:VNPAY_URL}
    returnUrl: ${VNPAY_RETURN_URL:VNPAY_RETURN_URL}
    tmnCode: ${VNPAY_TMN_CODE:VNPAY_TMN_CODE}
    secretKey: ${VNPAY_SECRET_KEY:VNPAY_SECRET_KEY}
    version: ${VNPAY_VERSION:VNPAY_VERSION}
    command: ${VNPAY_COMMAND:VNPAY_COMMAND}
    orderType: ${VNPAY_ORDER_TYPE:VNPAY_ORDER_TYPE}

  zaloPay:
    appId: ${ZALOPAY_APP_ID:ZALOPAY_APP_ID}
    key1: ${ZALOPAY_KEY1:ZALOPAY_KEY1}
    key2: ${ZALOPAY_KEY2:ZALOPAY_KEY2}
    zaloPayUrl: ${ZALOPAY_URL:ZALOPAY_URL}
    returnUrl: ${ZALOPAY_RETURN_URL:ZALOPAY_RETURN_URL}
    redirectUrl: ${ZALOPAY_REDIRECT_URL:ZALOPAY_REDIRECT_URL}
    callbackUrl: ${ZALOPAY_CALLBACK_URL:ZALOPAY_CALLBACK_URL}
    
  moMo:
    partnerCode: ${MOMO_PARTNER_CODE:MOMO_PARTNER_CODE}
    accessKey: ${MOMO_ACCESS_KEY:MOMO_ACCESS_KEY}
    secretKey: ${MOMO_SECRET_KEY:MOMO_SECRET_KEY}
    endpoint: ${MOMO_ENDPOINT:MOMO_ENDPOINT}
    returnUrl: ${MOMO_RETURN_URL:MOMO_RETURN_URL}
    ipnUrl: ${MOMO_IPN_URL:MOMO_IPN_URL}

frontend:
  url: ${FRONTEND_URL:FRONTEND_URL}
