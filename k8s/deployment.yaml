apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service-deployment
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - name: payment-service
        image: truongdocker1/bookstore-payment-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: DB_NAME
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: payment-service-secret
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: payment-service-secret
              key: DB_PASSWORD
        - name: RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: RABBITMQ_HOST
        - name: RABBITMQ_PORT
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: RABBITMQ_PORT
        - name: RABBITMQ_USERNAME
          valueFrom:
            secretKeyRef:
              name: payment-service-secret
              key: RABBITMQ_USERNAME
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: payment-service-secret
              key: RABBITMQ_PASSWORD
        - name: RABBITMQ_VIRTUAL_HOST
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: RABBITMQ_VIRTUAL_HOST
        
        # VNPay Integration
        - name: VNPAY_URL
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: VNPAY_URL
        - name: VNPAY_RETURN_URL
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: VNPAY_RETURN_URL
        - name: VNPAY_TMN_CODE
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: VNPAY_TMN_CODE
        - name: VNPAY_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: payment-service-secret
              key: VNPAY_SECRET_KEY
        - name: VNPAY_VERSION
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: VNPAY_VERSION
        - name: VNPAY_COMMAND
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: VNPAY_COMMAND
        - name: VNPAY_ORDER_TYPE
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: VNPAY_ORDER_TYPE

        # ZaloPay Integration
        - name: ZALOPAY_APP_ID
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: ZALOPAY_APP_ID
        - name: ZALOPAY_KEY1
          valueFrom:
            secretKeyRef:
              name: payment-service-secret
              key: ZALOPAY_KEY1
        - name: ZALOPAY_KEY2
          valueFrom:
            secretKeyRef:
              name: payment-service-secret
              key: ZALOPAY_KEY2
        - name: ZALOPAY_URL
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: ZALOPAY_URL
        - name: ZALOPAY_RETURN_URL
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: ZALOPAY_RETURN_URL
        - name: ZALOPAY_REDIRECT_URL
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: ZALOPAY_REDIRECT_URL
        - name: ZALOPAY_CALLBACK_URL
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: ZALOPAY_CALLBACK_URL

        # MoMo Integration
        - name: MOMO_PARTNER_CODE
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: MOMO_PARTNER_CODE
        - name: MOMO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: payment-service-secret
              key: MOMO_ACCESS_KEY
        - name: MOMO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: payment-service-secret
              key: MOMO_SECRET_KEY
        - name: MOMO_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: MOMO_ENDPOINT
        - name: MOMO_RETURN_URL
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: MOMO_RETURN_URL
        - name: MOMO_IPN_URL
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: MOMO_IPN_URL

        # Frontend Config
        - name: FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: FRONTEND_URL

        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
